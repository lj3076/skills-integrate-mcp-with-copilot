<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="account-controls">
        <span id="teacher-status">Student view</span>
        <button id="login-button" type="button">&#128100; Teacher login</button>
        <button id="logout-button" class="hidden" type="button">Log out</button>
      </div>
    </header>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher login</h3>
        <div class="form-group">
          <label for="teacher-username">Username:</label>
          <input id="teacher-username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="teacher-password">Password:</label>
          <input id="teacher-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div id="auth-message" class="message hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-login">Cancel</button>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </dialog>

    <dialog id="event-dialog" aria-labelledby="event-dialog-title">
      <form id="event-form">
        <h3 id="event-dialog-title">Add event</h3>
        <input type="hidden" name="activity_name" />
        <input type="hidden" name="event_id" />
        <div class="form-group">
          <label for="event-title">Event title:</label>
          <input id="event-title" name="title" maxlength="120" required />
        </div>
        <div class="form-group">
          <label for="event-date-time">Date and time:</label>
          <input id="event-date-time" name="date_time" type="datetime-local" required />
        </div>
        <div class="form-group">
          <label for="event-location">Location:</label>
          <input id="event-location" name="location" maxlength="200" required />
        </div>
        <div class="form-group">
          <label for="event-participation-type">Participation:</label>
          <select id="event-participation-type" name="participation_type" required>
            <option value="Individual">Individual</option>
            <option value="Team">Team</option>
          </select>
        </div>
        <div id="event-form-message" class="message hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-event">Cancel</button>
          <button type="submit">Save event</button>
        </div>
      </form>
    </dialog>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
